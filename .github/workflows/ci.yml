name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Secret scan (no API keys in the repo)
        run: |
          if grep -rIn --exclude-dir=.git -E "sk-ant-[A-Za-z0-9_-]{10,}" . ; then echo "API key found in repo"; exit 1; fi
      - name: Python only for logic (no JS/TS source files)
        run: |
          if git ls-files | grep -E "\.(js|jsx|ts|tsx)$" ; then echo "Logic must be Python (see AGENTS.md)"; exit 1; fi
      - run: python -m py_compile app.py
      - run: pytest -q -rxX
